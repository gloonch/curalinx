# Curalinx static site (Vite build in /var/www/curalinx).
# Install: /etc/nginx/sites-available/curalinx → symlink into sites-enabled.
# HTTPS is added afterwards by certbot (--nginx), which edits the copy on the
# server. Do not re-upload this file over it, or HTTPS is lost.
server {
    listen 80;
    listen [::]:80;
    server_name curalinx.it www.curalinx.it;

    root /var/www/curalinx;
    index index.html;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/about, …) fall back to the SPA entry.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
